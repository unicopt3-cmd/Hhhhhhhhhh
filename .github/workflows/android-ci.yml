name: Android CI — Build PT Pilot APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar e Gerar APK (PT Pilot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK e aceitar licenças
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 36 (se necessário) e aceitar licenças
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restaurar debug.keystore para assinatura do APK de depuração
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Validar existência do Gradle Wrapper e conceder permissão de execução
        run: |
          ls -la
          ls -la gradle/wrapper
          chmod +x ./gradlew

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executar testes unitários e Robolectric
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compilar APK instalável (Debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verificar APK gerado
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como artefato para download no navegador
        uses: actions/upload-artifact@v4
        with:
          name: PT-Pilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
