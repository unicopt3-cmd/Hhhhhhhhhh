name: Android CI — PT Pilot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & APK (PT Pilot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças do Android SDK e instalar API 36 / 36.1
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
          test -d "$ANDROID_HOME/platforms/android-36.1"

      - name: Restaurar debug.keystore para assinatura Debug
        shell: bash
        run: |
          set -e
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -s debug.keystore

      - name: Verificar Gradle Wrapper e conceder permissão de execução
        shell: bash
        run: |
          set -e
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew --version

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executar testes unitários, Robolectric e Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Compilar APK instalável (Debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verificar APK gerado no caminho esperado
        shell: bash
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload do APK como artefato do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PT-Pilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
