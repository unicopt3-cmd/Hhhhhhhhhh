name: Android CI — PT Pilot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & APK (PT Pilot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Android SDK nativo, aceitar licenças e instalar API 36 / 36.1
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          fi

          test -x "$SDKMANAGER"
          echo "Usando sdkmanager: $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          test -s "$SDK_ROOT/licenses/android-sdk-license"
          test -d "$SDK_ROOT/platforms/android-36.1"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Restaurar debug.keystore para assinatura Debug
        shell: bash
        run: |
          set -e
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -s debug.keystore

      - name: Verificar Gradle Wrapper e conceder permissão de execução
        shell: bash
        run: |
          set -e
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew --version

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executar testes unitários, Robolectric e Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Compilar APK instalável (Debug)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verificar APK gerado no caminho esperado
        shell: bash
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload do APK como artefato do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: PT-Pilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
